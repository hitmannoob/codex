[package]
name = "codex-agents-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
clap = { workspace = true, features = ["derive", "env"] }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-state = { workspace = true }
codex-tools = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
codex-app-server-transport = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
app_test_support = { path = "../app-server/tests/common" }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-feedback = { workspace = true }
codex-protocol = { workspace = true }
codex-rollout = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
wiremock = { workspace = true }
